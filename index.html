<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bibliothèque Pro</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <main class="page-wrap">
    <section class="app-card">
      <h1 class="app-title">📚 Gestion de Bibliothèque</h1>

      <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="Rechercher un livre..." oninput="filterBooks()" />
      </div>

      <div class="table-container">
        <table id="booksTable">
          <thead>
            <tr>
              <th>Titre</th>
              <th>Auteur</th>
              <th>Année</th>
              <th>Prix</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="booksBody">
            <tr id="loadingRow">
              <td colspan="5" class="loading-cell">Chargement des livres...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="add-book-section">
        <h2 id="formTitle">Ajouter un livre</h2>
        <form id="bookForm" onsubmit="submitBookForm(event)">
          <input type="hidden" id="editIndex" value="-1" />

          <div class="form-group">
            <input type="text" id="inputTitle" placeholder="Titre" required />
          </div>
          <div class="form-group">
            <input type="text" id="inputAuthor" placeholder="Auteur" required />
          </div>
          <div class="form-group">
            <input type="number" id="inputYear" placeholder="Année" min="1000" max="2099" required />
          </div>
          <div class="form-group">
            <input type="text" id="inputPrice" placeholder="Prix" />
          </div>
          <div class="form-group">
            <input type="text" id="inputCover" placeholder="URL image couverture" />
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="cancelBtn" style="display:none;" onclick="resetForm()">Annuler</button>
            <button type="submit" class="btn btn-add" id="formSubmitBtn">Ajouter</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <!-- ========== MODAL: Détails livre ========== -->
  <div id="detailModal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'detailModal')">
    <div class="modal">
      <button class="modal-close" onclick="closeModal('detailModal')"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-book-detail">
        <img id="detailCover" src="" alt="Couverture" class="detail-cover" />
        <div class="detail-info">
          <h2 id="detailTitle"></h2>
          <p><span class="label">Auteur :</span> <span id="detailAuthor"></span></p>
          <p><span class="label">Année :</span> <span id="detailYear"></span></p>
          <p><span class="label">Prix :</span> <span id="detailPrice"></span></p>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== MODAL: Confirmation Suppression ========== -->
  <div id="deleteModal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'deleteModal')">
    <div class="modal modal-small">
      <button class="modal-close" onclick="closeModal('deleteModal')"><i class="fa-solid fa-xmark"></i></button>
      <div class="confirm-icon"><i class="fa-solid fa-trash-can"></i></div>
      <h2>Confirmer la suppression</h2>
      <p>Voulez-vous vraiment supprimer <strong id="deleteBookTitle"></strong> ?</p>
      <div class="form-actions">
        <button class="btn btn-secondary" onclick="closeModal('deleteModal')"><i class="fa-solid fa-ban"></i> Annuler</button>
        <button class="btn btn-danger" onclick="confirmDelete()"><i class="fa-solid fa-trash-can"></i> Supprimer</button>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
